<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t">
  <title id="t">InstitutePulse dashboard showing today's attendance, a weekly chart and class status</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset=".55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#4f46e5" flood-opacity=".18"/>
    </filter>
  </defs>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <!-- window -->
    <rect x="10" y="10" width="620" height="414" rx="18" fill="#fff" stroke="#e6e9f2" filter="url(#sh)"/>
    <path d="M10 44 h620" stroke="#eef0f6"/>
    <circle cx="32" cy="27" r="5" fill="#fda4af"/><circle cx="48" cy="27" r="5" fill="#fcd34d"/><circle cx="64" cy="27" r="5" fill="#86efac"/>
    <rect x="220" y="18" width="200" height="18" rx="9" fill="#f5f7fc"/>
    <text x="320" y="31" text-anchor="middle" font-size="10" fill="#6b7489">InstitutePulse · Dashboard</text>

    <!-- sidebar -->
    <path d="M10 44 h120 v362 a18 18 0 0 1 -18 18 h-84 a18 18 0 0 1 -18 -18z" fill="#faf9ff"/>
    <rect x="24" y="60" width="26" height="26" rx="7" fill="url(#g)"/>
    <path d="M30 75 h4 l3 -6 l4 11 l3 -5 h3" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="71" font-size="10" font-weight="800" fill="#0b1020">Institute</text>
    <text x="56" y="84" font-size="10" font-weight="800" fill="#7c3aed">Pulse</text>
    <rect x="20" y="104" width="100" height="28" rx="8" fill="#ede9fe"/>
    <rect x="30" y="113" width="10" height="10" rx="2.5" fill="#7c3aed"/>
    <text x="48" y="122" font-size="11" font-weight="700" fill="#4f46e5">Dashboard</text>
    <g font-size="11" fill="#6b7489">
      <rect x="30" y="149" width="10" height="10" rx="2.5" fill="#cbd0dd"/><text x="48" y="158">Attendance</text>
      <rect x="30" y="181" width="10" height="10" rx="2.5" fill="#cbd0dd"/><text x="48" y="190">Classes</text>
      <rect x="30" y="213" width="10" height="10" rx="2.5" fill="#cbd0dd"/><text x="48" y="222">Students</text>
      <rect x="30" y="245" width="10" height="10" rx="2.5" fill="#cbd0dd"/><text x="48" y="254">Reports</text>
      <rect x="30" y="277" width="10" height="10" rx="2.5" fill="#cbd0dd"/><text x="48" y="286">Settings</text>
    </g>

    <!-- header -->
    <text x="148" y="78" font-size="16" font-weight="800" fill="#0b1020">Today's attendance</text>
    <text x="148" y="95" font-size="10.5" fill="#6b7489">Monday · All classes</text>
    <rect x="514" y="62" width="100" height="28" rx="14" fill="url(#g)"/>
    <text x="564" y="80" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">Export report</text>

    <!-- stat tiles -->
    <rect x="148" y="110" width="146" height="70" rx="12" fill="#fff" stroke="#e6e9f2"/>
    <text x="162" y="130" font-size="10.5" fill="#6b7489">Present</text>
    <text x="162" y="158" font-size="22" font-weight="800" fill="#0b1020">412</text>
    <rect x="232" y="144" width="48" height="18" rx="9" fill="#d1fae5"/><text x="256" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">95.8%</text>

    <rect x="308" y="110" width="146" height="70" rx="12" fill="#fff" stroke="#e6e9f2"/>
    <text x="322" y="130" font-size="10.5" fill="#6b7489">Absent</text>
    <text x="322" y="158" font-size="22" font-weight="800" fill="#0b1020">18</text>
    <rect x="392" y="144" width="48" height="18" rx="9" fill="#fee2e2"/><text x="416" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">4.2%</text>

    <rect x="468" y="110" width="146" height="70" rx="12" fill="#fff" stroke="#e6e9f2"/>
    <text x="482" y="130" font-size="10.5" fill="#6b7489">Classes marked</text>
    <text x="482" y="158" font-size="22" font-weight="800" fill="#0b1020">14<tspan font-size="14" fill="#6b7489"> / 16</tspan></text>
    <rect x="482" y="166" width="118" height="5" rx="2.5" fill="#f1f2f8"/><rect x="482" y="166" width="103" height="5" rx="2.5" fill="url(#g)"/>

    <!-- weekly chart -->
    <rect x="148" y="194" width="276" height="214" rx="12" fill="#fff" stroke="#e6e9f2"/>
    <text x="162" y="216" font-size="12" font-weight="700" fill="#0b1020">This week</text>
    <text x="410" y="216" text-anchor="end" font-size="10" fill="#6b7489">Attendance %</text>
    <g stroke="#f1f2f8">
      <path d="M162 250 h248 M162 290 h248 M162 330 h248 M162 370 h248"/>
    </g>
    <g fill="url(#bar)">
      <rect x="174" y="252" width="24" height="118" rx="6"/>
      <rect x="213" y="262" width="24" height="108" rx="6"/>
      <rect x="252" y="246" width="24" height="124" rx="6"/>
      <rect x="291" y="270" width="24" height="100" rx="6"/>
      <rect x="330" y="256" width="24" height="114" rx="6"/>
    </g>
    <rect x="369" y="300" width="24" height="70" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-dasharray="4 3"/>
    <g font-size="10" fill="#6b7489" text-anchor="middle">
      <text x="186" y="390">Mon</text><text x="225" y="390">Tue</text><text x="264" y="390">Wed</text>
      <text x="303" y="390">Thu</text><text x="342" y="390">Fri</text><text x="381" y="390">Sat</text>
    </g>

    <!-- class list -->
    <rect x="438" y="194" width="176" height="214" rx="12" fill="#fff" stroke="#e6e9f2"/>
    <text x="452" y="216" font-size="12" font-weight="700" fill="#0b1020">Classes</text>
    <g font-size="11">
      <circle cx="462" cy="243" r="10" fill="#ede9fe"/><text x="462" y="247" text-anchor="middle" font-size="8.5" font-weight="800" fill="#7c3aed">6A</text>
      <text x="480" y="241" font-weight="700" fill="#0b1020">Class 6-A</text><text x="480" y="254" font-size="9.5" fill="#6b7489">38 / 40</text>
      <rect x="552" y="234" width="50" height="18" rx="9" fill="#d1fae5"/><text x="577" y="246.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#059669">Marked</text>

      <circle cx="462" cy="281" r="10" fill="#ede9fe"/><text x="462" y="285" text-anchor="middle" font-size="8.5" font-weight="800" fill="#7c3aed">7B</text>
      <text x="480" y="279" font-weight="700" fill="#0b1020">Class 7-B</text><text x="480" y="292" font-size="9.5" fill="#6b7489">35 / 36</text>
      <rect x="552" y="272" width="50" height="18" rx="9" fill="#d1fae5"/><text x="577" y="284.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#059669">Marked</text>

      <circle cx="462" cy="319" r="10" fill="#ede9fe"/><text x="462" y="323" text-anchor="middle" font-size="8.5" font-weight="800" fill="#7c3aed">9C</text>
      <text x="480" y="317" font-weight="700" fill="#0b1020">Class 9-C</text><text x="480" y="330" font-size="9.5" fill="#6b7489">Period 1</text>
      <rect x="552" y="310" width="50" height="18" rx="9" fill="#fef3c7"/><text x="577" y="322.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b45309">Pending</text>

      <circle cx="462" cy="357" r="10" fill="#ede9fe"/><text x="462" y="361" text-anchor="middle" font-size="8.5" font-weight="800" fill="#7c3aed">10B</text>
      <text x="480" y="355" font-weight="700" fill="#0b1020">Class 10-B</text><text x="480" y="368" font-size="9.5" fill="#6b7489">42 / 44</text>
      <rect x="552" y="348" width="50" height="18" rx="9" fill="#d1fae5"/><text x="577" y="360.5" text-anchor="middle" font-size="9.5" font-weight="700" fill="#059669">Marked</text>
    </g>
    <text x="452" y="396" font-size="10" font-weight="700" fill="#4f46e5">View all classes →</text>
  </g>
</svg>
